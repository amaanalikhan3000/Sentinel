spring:
  profiles:
    active: local
  application:
    name: sentinel-ai-backend
  datasource:
    url: ${MYSQL_URL:jdbc:mysql://localhost:3306/sentinelai}
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:root}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update


  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

    consumer:
      group-id: payment-processor
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: com.sentinelai.backend.kakfa
        spring.json.value.default.type: com.sentinelai.backend.kakfa.PaymentEvent

    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: false